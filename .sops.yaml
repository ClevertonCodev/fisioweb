# sops recipient map: who can decrypt which file.
#
# One key for everything: the operator's age key at
# ~/.config/sops/age/keys.txt (sops's default lookup path — found
# automatically, no env var needed). install.sh ships the same key file
# to the VM at /var/lib/sops-nix/key.txt so sops-install-secrets can
# decrypt /run/secrets/* on every activation.
#
# Scoping here is by *placement*, not by cryptography:
#   - secrets/*.env         ship to the VM (decrypted at every boot)
#   - secrets/operator/*    never leave the operator's machine
#                           (direnv decrypts on demand)
#
# This key exists in exactly two places: an operator's laptop, and
# /var/lib/sops-nix/key.txt on the VM. Notably NOT in GitHub — deploys
# run from an operator's machine, so no CI system ever needs to decrypt
# anything here.
#
# If you ever want finer separation of duty, generate a second age key,
# give it its own alias, and drop it from the rules covering secrets
# that particular holder doesn't need.

keys:
  - &fisioweb age1p7x52slpqnd0d9zy2p4x7ga73hzgp2737uc7j9zzkh9tun50zsqq20czfv

creation_rules:
  # Bulk Laravel .env for production. sops-nix mounts it and the
  # laravel-env template concatenates it with the narrower files below.
  - path_regex: ^secrets/app\.env$
    age:
      - *fisioweb

  # Cloudflare R2 credentials for Laravel's `r2` filesystem disk
  # (account 4925f2b7…, the app-uploads bucket). Kept separate from
  # app.env so the credential can be rotated without touching the rest
  # of the environment.
  - path_regex: ^secrets/r2-app-creds\.env$
    age:
      - *fisioweb

  # APP_URL + GOOGLE_REDIRECT_URI, generated by infra/nix/deploy.sh from
  # `tofu output -raw app_floating_ipv4`. Appended LAST in the
  # laravel-env template so it wins over anything in app.env — that's
  # what keeps the app's public address in exactly one place (tofu
  # state) instead of hand-copied into a secret.
  - path_regex: ^secrets/app-url\.env$
    age:
      - *fisioweb

  # R2 S3 credentials for the pg-backup systemd unit (account
  # 7c45003b…, the backups bucket). Binary rather than dotenv because
  # systemd mounts the decrypted file whole as EnvironmentFile=.
  - path_regex: ^secrets/r2-backup-creds$
    age:
      - *fisioweb

  # Operator-only secrets. These never ship to the VM — the tfstate
  # passphrase in particular is what stands between a leaked R2 key and
  # a readable state file containing the Hetzner token.
  - path_regex: ^secrets/operator/.*$
    age:
      - *fisioweb

  # OpenTofu provider credentials, dotenv format. Keys stay plaintext,
  # values are encrypted. direnv decrypts and exports them on
  # `cd infra/tofu/` — see infra/tofu/.envrc.
  - path_regex: ^infra/tofu/credentials\.env$
    age:
      - *fisioweb
